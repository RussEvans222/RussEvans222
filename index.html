<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Full-screen on iOS, cover the notch/home bar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA: hides Safari chrome when launched from home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Messages" />

    <!-- Matches iOS status bar / browser toolbar colour -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Prevent phone-number auto-detection -->
    <meta name="format-detection" content="telephone=no" />

    <title>Messages</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS home-screen icon (green Messages-style) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2334C759'/><text y='72' x='50' text-anchor='middle' font-size='60'>💬</text></svg>" />

    <style>
      /* Prevent flash of unstyled content */
      body { background: #fff; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
